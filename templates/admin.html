<h2>Admin Panel</h2>

{% for order in orders %}
    <p>
        {{ order.menu }} |
        Qty: {{ order.quantity }} |
        Status: <b>{{ order.status }}</b> |
        Updated: {{ order.status_time }}
    </p>

    <a href="/update_status/{{ loop.index0 }}/Preparing">Preparing</a> |
    <a href="/update_status/{{ loop.index0 }}/Ready">Ready</a>

    <hr>
{% endfor %}

<a href="/">Home</a>
