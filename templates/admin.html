<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
</head>
<body>

<h2>All Orders</h2>

{% if orders %}
    <ul>
    {% for order in orders %}
        <li>
            {{ order.menu }} |
            Qty: {{ order.quantity }} |
            Time: {{ order.time }}
        </li>
    {% endfor %}
    </ul>
{% else %}
    <p>No orders yet.</p>
{% endif %}

<a href="/">Home</a>

</body>
</html>
