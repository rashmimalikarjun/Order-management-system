<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Success - Catering System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 2.2em;
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .success-icon {
            font-size: 80px;
            text-align: center;
            margin: 20px 0;
            animation: bounce 0.8s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin: 30px 0;
        }

        table {
            width: 100%;
        }

        table td {
            padding: 12px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        table td:first-child {
            font-weight: 600;
            color: #555;
            width: 40%;
        }

        .status {
            display: inline-block;
            padding: 6px 15px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            background: #fff3cd;
            color: #856404;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            margin: 5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .nav-links {
            text-align: center;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">✅</div>
        <h1>Order Placed Successfully!</h1>
        <p style="text-align: center; font-size: 1.2em; color: #666; margin-bottom: 20px;">
            Your catering request has been recorded.
        </p>

        <div class="card">
            <h3 style="text-align: center; margin-bottom: 20px;">📋 Order Details</h3>
            
            <table>
                <tr>
                    <td>Order ID:</td>
                    <td><strong>#{{ order.id }}</strong></td>
                </tr>
                <tr>
                    <td>Customer:</td>
                    <td>{{ order.username }}</td>
                </tr>
                <tr>
                    <td>Menu:</td>
                    <td>{{ order.menu }}</td>
                </tr>
                <tr>
                    <td>Quantity:</td>
                    <td>{{ order.quantity }}</td>
                </tr>
                <tr>
                    <td>Status:</td>
                    <td><span class="status">{{ order.status }}</span></td>
                </tr>
                <tr>
                    <td>Order Time:</td>
                    <td>{{ order.time }}</td>
                </tr>
            </table>
        </div>

        <div class="nav-links">
            <a href="/" class="btn">🏠 Back to Home</a>
            <a href="{{ url_for('my_orders', username=order.username) }}" class="btn btn-success">📋 View All My Orders</a>
        </div>
    </div>
</body>
</html>
